schema_version: "1.1"
name: repo-mastery--fix-local-git-error
description: "Should NOT trigger repo-mastery. Expected (not graded): Should be answered as a general git question without invoking repo-mastery inventory/subagent workflow"
tags: [repo-mastery, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "My git commit failed with a detached HEAD error in this repo, how do I fix it?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?repo-mastery\""
    min: 0
    max: 0
    arm: both
