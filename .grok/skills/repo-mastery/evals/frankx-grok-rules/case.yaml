schema_version: "1.1"
name: repo-mastery--frankx-grok-rules
description: "Should trigger repo-mastery."
tags: [repo-mastery, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Before you touch FrankX, read CLAUDE.md and GROK.md first and then show me the harness integration points and skills catalog for that repo"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?repo-mastery\""
