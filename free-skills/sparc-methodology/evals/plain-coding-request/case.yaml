schema_version: "1.1"
name: sparc-methodology--plain-coding-request
description: "Should NOT trigger sparc-methodology. Expected (not graded): Skill does not activate; simple code request handled directly without SPARC phases"
tags: [sparc-methodology, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Write me a quick Python function to reverse a string"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?sparc-methodology\""
    min: 0
    max: 0
    arm: both
