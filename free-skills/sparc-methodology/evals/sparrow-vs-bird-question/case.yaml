schema_version: "1.1"
name: sparc-methodology--sparrow-vs-bird-question
description: "Should NOT trigger sparc-methodology. Expected (not graded): Skill does not activate; unrelated question despite superficial keyword similarity"
tags: [sparc-methodology, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "What's the difference between a sparrow and a swallow?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?sparc-methodology\""
    min: 0
    max: 0
    arm: both
