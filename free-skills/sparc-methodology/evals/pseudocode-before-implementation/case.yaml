schema_version: "1.1"
name: sparc-methodology--pseudocode-before-implementation
description: "Behaviour of sparc-methodology; outcome graded."
tags: [sparc-methodology, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Apply the SPARC methodology to implement a rate limiter utility, writing out each phase's output"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?sparc-methodology\""
  - name: judged-0
    type: llm
    criteria: "Pseudocode for the rate limiter logic is produced in the response before the concrete implementation code appears"
