schema_version: "1.1"
name: oracle-ai-architect--iam-policy-behaviour
description: "Behaviour of oracle-ai-architect; outcome graded."
tags: [oracle-ai-architect, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "In Oracle Cloud Infrastructure (OCI), what IAM policies do I need so my data scientists group can use OCI Generative AI and my agent instances dynamic group can access the Autonomous Database in the Data compartment?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?oracle-ai-architect\""
  - name: judged-0
    type: llm
    criteria: "Response includes OCI IAM policy statements referencing generative-ai-family and autonomous-database-family"
