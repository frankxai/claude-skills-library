schema_version: "1.1"
name: oracle-ai-architect--cost-model-behaviour
description: "Behaviour of oracle-ai-architect; outcome graded."
tags: [oracle-ai-architect, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "For OCI Generative AI, which model should I pick for a simple customer-facing chatbot, and how can I reduce embedding API costs for repeated identical texts?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?oracle-ai-architect\""
  - name: judged-0
    type: llm
    criteria: "Response names a low-cost model for simple chat (e.g., Cohere Command Light) and describes an embedding caching approach such as hashing input text and using lru_cache"
