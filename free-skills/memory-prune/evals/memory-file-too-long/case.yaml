schema_version: "1.1"
name: memory-prune--memory-file-too-long
description: "Should trigger memory-prune. Expected (not graded): Skill triggers; prune invoked listing project_*.md entries older than 30 days, each with filename, age in days, and a content preview"
tags: [memory-prune, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "MEMORY.md just hit 195 lines, can you run a prune?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?memory-prune\""
