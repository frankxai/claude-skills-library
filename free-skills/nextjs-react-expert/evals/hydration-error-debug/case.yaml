schema_version: "1.1"
name: nextjs-react-expert--hydration-error-debug
description: "Should trigger nextjs-react-expert."
tags: [nextjs-react-expert, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "My Next.js 14 app throws a hydration mismatch error on a product page that renders a date. How do I debug and fix this?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?nextjs-react-expert\""
