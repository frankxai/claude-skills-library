schema_version: "1.1"
name: nextjs-react-expert--server-action-revalidate
description: "Behaviour of nextjs-react-expert; outcome graded."
tags: [nextjs-react-expert, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Write a server action to delete a comment (comment id passed as input) from a Next.js App Router app where the comment is rendered at /posts/[postId]. Include proper cache handling for that post page."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?nextjs-react-expert\""
  - name: judged-0
    type: llm
    criteria: "The provided code defines a 'use server' action that deletes the comment and calls revalidatePath('/posts/' + postId) (or revalidates a tag tied to that specific post) so the affected post page is refreshed — not a hardcoded or unrelated path."
