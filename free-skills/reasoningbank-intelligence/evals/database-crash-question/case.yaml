schema_version: "1.1"
name: reasoningbank-intelligence--database-crash-question
description: "Should NOT trigger reasoningbank-intelligence."
tags: [reasoningbank-intelligence, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "My Postgres database keeps crashing under load. What should I check first?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?reasoningbank-intelligence\""
    min: 0
    max: 0
    arm: both
