schema_version: "1.1"
name: canvas-design--website-build-request
description: "Should NOT trigger canvas-design."
tags: [canvas-design, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Build me a responsive landing page for my design portfolio with HTML and CSS."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?canvas-design\""
    min: 0
    max: 0
    arm: both
