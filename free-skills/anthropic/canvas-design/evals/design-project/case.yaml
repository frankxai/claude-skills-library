schema_version: "1.1"
name: canvas-design--design-project
description: "Should trigger canvas-design."
tags: [canvas-design, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Design a static visual piece for the cover of our magazine issue about silence."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?canvas-design\""
