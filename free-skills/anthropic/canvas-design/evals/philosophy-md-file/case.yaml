schema_version: "1.1"
name: canvas-design--philosophy-md-file
description: "Behaviour of canvas-design; outcome graded."
tags: [canvas-design, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Make an art piece inspired by deep ocean trenches."
  max_turns: 6
  allowed_tools: [Skill, Read, Write, Bash]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?canvas-design\""
  - name: judged-0
    type: llm
    criteria: "A .md file containing a named design philosophy of 4-6 paragraphs is produced alongside the image/pdf."
