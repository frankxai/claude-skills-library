schema_version: "1.1"
name: canvas-design--poster-request
description: "Should trigger canvas-design."
tags: [canvas-design, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Can you make me a really striking poster for my band's upcoming show?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?canvas-design\""
