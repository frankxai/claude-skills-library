schema_version: "1.1"
name: webapp-testing--debug-console-errors
description: "Should trigger webapp-testing."
tags: [webapp-testing, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "My React todo app keeps showing a blank page — can you spin it up and check the browser console for errors?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?webapp-testing\""
