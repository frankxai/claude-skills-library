schema_version: "1.1"
name: webapp-testing--write-unit-tests
description: "Should NOT trigger webapp-testing."
tags: [webapp-testing, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Can you write some pytest unit tests for my Python utility functions?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?webapp-testing\""
    min: 0
    max: 0
    arm: both
