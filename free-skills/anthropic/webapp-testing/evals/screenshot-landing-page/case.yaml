schema_version: "1.1"
name: webapp-testing--screenshot-landing-page
description: "Should trigger webapp-testing."
tags: [webapp-testing, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Please take a screenshot of my local dev site at localhost:3000 so I can see what the landing page looks like right now"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?webapp-testing\""
