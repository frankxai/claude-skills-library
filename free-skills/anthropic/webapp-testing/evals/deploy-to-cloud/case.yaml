schema_version: "1.1"
name: webapp-testing--deploy-to-cloud
description: "Should NOT trigger webapp-testing."
tags: [webapp-testing, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "How do I deploy my web app to AWS and set up HTTPS with a load balancer?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?webapp-testing\""
    min: 0
    max: 0
    arm: both
