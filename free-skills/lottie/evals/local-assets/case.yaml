schema_version: "1.1"
name: lottie--local-assets
description: "Behaviour of lottie; outcome graded."
tags: [lottie, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Embed my Lottie animation in HyperFrames using the file hosted at https://cdn.example.com/anim.json."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?lottie\""
  - name: judged-0
    type: llm
    criteria: "Code does not load from the remote CDN URL and instead instructs loading from a local project path under assets/."
