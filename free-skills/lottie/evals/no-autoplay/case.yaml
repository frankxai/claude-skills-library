schema_version: "1.1"
name: lottie--no-autoplay
description: "Behaviour of lottie; outcome graded."
tags: [lottie, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Embed my logo-reveal.json lottie-web animation in HyperFrames."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?lottie\""
  - name: judged-0
    type: llm
    criteria: "Code sets autoplay: false and does not call play()."
