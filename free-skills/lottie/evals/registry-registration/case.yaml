schema_version: "1.1"
name: lottie--registry-registration
description: "Behaviour of lottie; outcome graded."
tags: [lottie, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Set up my product-flow.lottie animation on a canvas in HyperFrames using the dotLottie player."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?lottie\""
  - name: judged-0
    type: llm
    criteria: "Generated code registers the player on window.__hfLottie (initializing the array if absent) and passes autoplay: false."
