schema_version: "1.1"
name: lottie--plain-svg-animation
description: "Should NOT trigger lottie."
tags: [lottie, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "How do I animate an SVG path with CSS keyframes in my HyperFrames frame?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?lottie\""
    min: 0
    max: 0
    arm: both
