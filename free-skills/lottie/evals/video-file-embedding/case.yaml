schema_version: "1.1"
name: lottie--video-file-embedding
description: "Should NOT trigger lottie."
tags: [lottie, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "I want to embed an mp4 background video in my HyperFrames page, what's the recommended approach?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?lottie\""
    min: 0
    max: 0
    arm: both
