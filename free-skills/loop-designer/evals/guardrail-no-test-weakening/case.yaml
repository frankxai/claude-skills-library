schema_version: "1.1"
name: loop-designer--guardrail-no-test-weakening
description: "Behaviour of loop-designer; outcome graded."
tags: [loop-designer, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Create a loop to raise our flaky-test suite from 60% to 100% pass rate, running one flaky test fix per iteration until CI is fully green."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?loop-designer\""
  - name: judged-0
    type: llm
    criteria: "The Guardrails section of LOOP.md explicitly forbids removing or weakening tests, assertions, or gate configs to make work pass (stated in writing), and specifies automatic revert on ratchet regression."
