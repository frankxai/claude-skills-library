schema_version: "1.1"
name: loop-designer--continuous-backlog
description: "Should trigger loop-designer. Expected (not graded): Agent compiles a backlog-drain loop: .loop/<name>/ with LOOP.md naming archetype 'backlog-drain', backlog.md with units sized so one unit completes and verifies in one session, declared budgets, and a recurring one-iteration handoff instruction."
tags: [loop-designer, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Set up a loop that drains my code TODO backlog 24/7: every 30 minutes Codex should pick the top item from a prioritized file-backed checklist, fix it, verify it, and strike it off — one small unit per session, resumable from cold context."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?loop-designer\""
