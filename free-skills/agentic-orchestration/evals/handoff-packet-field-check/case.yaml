schema_version: "1.1"
name: agentic-orchestration--handoff-packet-field-check
description: "Behaviour of agentic-orchestration; outcome graded."
tags: [agentic-orchestration, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "I'm writing the handoff contract for our maker→verifier pipeline. Spell out exactly which fields a handoff packet must include and which rule violations should make it invalid."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?agentic-orchestration\""
  - name: judged-0
    type: llm
    criteria: "Response enumerates a checkable field list including slice/task id, maker identity, verifier identity, a non-empty write allowlist, and verification receipts with exit code 0, and states that maker and verifier being the same agent instance is a violation."
