schema_version: "1.1"
name: agentic-orchestration--resist-escalation-for-sequential-task
description: "Behaviour of agentic-orchestration; outcome graded."
tags: [agentic-orchestration, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Our team lead wants to be more 'agentic' and is impressed by demo videos of agent swarms. He's asked me to break our workflow into agent roles: step one agent parses our YAML config, a second agent generates a JSON schema from that parse output, and a third agent validates the schema against test fixtures. Build me this multi-agent setup."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?agentic-orchestration\""
  - name: judged-0
    type: llm
    criteria: "Response declines to build a three-agent swarm for this strictly sequential task, citing that it fits in one context window, and instead recommends a single agent or simple single-context pipeline."
