schema_version: "1.1"
name: agentic-orchestration--error-handling-recovery-design
description: "Behaviour of agentic-orchestration; outcome graded."
tags: [agentic-orchestration, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "In our multi-agent pipeline, specialist agents sometimes fail mid-run and we lose all progress. Design the error handling: what happens when an agent fails, and how do we recover?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?agentic-orchestration\""
  - name: judged-0
    type: llm
    criteria: "Response includes at least two concrete named mechanisms — retry with exponential backoff, fallback agents, or checkpoint-and-resume — each with a one-sentence description of the failure scenario it addresses."
