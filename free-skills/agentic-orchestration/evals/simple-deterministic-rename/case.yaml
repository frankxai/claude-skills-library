schema_version: "1.1"
name: agentic-orchestration--simple-deterministic-rename
description: "Should NOT trigger agentic-orchestration. Expected (not graded): Response performs the deterministic rename directly without escalating to multi-agent coordination."
tags: [agentic-orchestration, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Rename the variable 'tmpData' to 'cachedResponse' everywhere in helpers.js."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?agentic-orchestration\""
    min: 0
    max: 0
    arm: both
