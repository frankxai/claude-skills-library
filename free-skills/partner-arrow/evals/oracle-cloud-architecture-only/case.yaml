schema_version: "1.1"
name: partner-arrow--oracle-cloud-architecture-only
description: "Should NOT trigger partner-arrow."
tags: [partner-arrow, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Design a reference architecture for deploying an agent workload on Oracle Cloud Infrastructure — just the OCI bits, nothing about distribution partners."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?partner-arrow\""
    min: 0
    max: 0
    arm: both
