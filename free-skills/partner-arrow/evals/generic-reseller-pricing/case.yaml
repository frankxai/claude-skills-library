schema_version: "1.1"
name: partner-arrow--generic-reseller-pricing
description: "Should NOT trigger partner-arrow."
tags: [partner-arrow, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "How do typical software reseller discount tiers and rebate structures work in IT distribution generally?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?partner-arrow\""
    min: 0
    max: 0
    arm: both
