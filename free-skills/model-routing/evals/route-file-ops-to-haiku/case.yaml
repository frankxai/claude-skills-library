schema_version: "1.1"
name: model-routing--route-file-ops-to-haiku
description: "Behaviour of model-routing; outcome graded."
tags: [model-routing, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Set up routing so that simple file listing and config scaffolding tasks go to the cheap fast model. Which exact model ID should the routing config use?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?model-routing\""
  - name: judged-0
    type: llm
    criteria: "Names claude-haiku-4-5 as the model ID, with no date suffix appended."
