schema_version: "1.1"
name: model-routing--build-routing-layer
description: "Should trigger model-routing. Expected (not graded): Describes a routing implementation (complexity analysis, tier mapping, escalation path) consistent with the skill's tiers and rules."
tags: [model-routing, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Help me build a tiered routing layer for my app that sends each user request to the right model based on complexity."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?model-routing\""
