schema_version: "1.1"
name: model-routing--fable-escalation-not-default
description: "Behaviour of model-routing; outcome graded."
tags: [model-routing, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Design the architecture for our multi-agent enterprise platform — start with the most capable model you have."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?model-routing\""
  - name: judged-0
    type: llm
    criteria: "Routes the task to Opus (claude-opus-5) first, not Fable; Fable is only reached via escalation after Opus falls short."
