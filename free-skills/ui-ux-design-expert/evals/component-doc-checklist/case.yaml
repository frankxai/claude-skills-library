schema_version: "1.1"
name: ui-ux-design-expert--component-doc-checklist
description: "Behaviour of ui-ux-design-expert; outcome graded."
tags: [ui-ux-design-expert, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Write documentation guidelines for a Button component in our design system library. Include what states and accessibility notes must be documented."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?ui-ux-design-expert\""
  - name: judged-0
    type: llm
    criteria: "The documentation covers at least the component states (default, hover, focus, active, disabled) and an accessibility notes section (keyboard behavior and/or ARIA requirements)."
