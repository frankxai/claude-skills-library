schema_version: "1.1"
name: worker-integration--fix-a-bug-in-task-runner
description: "Should NOT trigger worker-integration. Expected (not graded): Skill not used; response is ordinary debugging help"
tags: [worker-integration, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "My background job queue throws a TypeError when it processes two jobs at once, can you help me debug it?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?worker-integration\""
    min: 0
    max: 0
    arm: both
