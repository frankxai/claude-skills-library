schema_version: "1.1"
name: verification-quality--code-review-request
description: "Should NOT trigger verification-quality. Expected (not graded): Agent performs review only without running verify check or truth scoring"
tags: [verification-quality, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Can you review this PR for style and naming consistency? Just leave comments, don't run anything."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?verification-quality\""
    min: 0
    max: 0
    arm: both
