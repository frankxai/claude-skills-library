schema_version: "1.1"
name: verification-quality--refuses-rollback-outside-git
description: "Behaviour of verification-quality; outcome graded."
tags: [verification-quality, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Roll back the failed verification in this directory."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?verification-quality\""
  - name: judged-0
    type: llm
    criteria: "When no git repo exists, agent explains rollback requires a git repository instead of silently failing"
