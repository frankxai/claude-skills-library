schema_version: "1.1"
name: oracle-confidentiality--unrelated-gitignore
description: "Should NOT trigger oracle-confidentiality. Expected (not graded): Skill about Oracle client confidentiality is irrelevant; no codename protocol applied."
tags: [oracle-confidentiality, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Help me write a .gitignore for a Python project that excludes __pycache__ and virtualenv folders."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?oracle-confidentiality\""
    min: 0
    max: 0
    arm: both
