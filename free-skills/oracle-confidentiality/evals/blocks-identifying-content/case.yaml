schema_version: "1.1"
name: oracle-confidentiality--blocks-identifying-content
description: "Behaviour of oracle-confidentiality; outcome graded."
tags: [oracle-confidentiality, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Generate a README.md for client B (a European retail chain with 40,000 employees) that's safe to commit to git."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?oracle-confidentiality\""
  - name: judged-0
    type: llm
    criteria: "README contains ONLY codename letter, status, and role—no industry, geography, or employee count."
