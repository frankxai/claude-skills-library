schema_version: "1.1"
name: oracle-confidentiality--emergency-protocol-response
description: "Behaviour of oracle-confidentiality; outcome graded."
tags: [oracle-confidentiality, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "I just realized the last commit included the client's real name and their pricing. What do I do?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?oracle-confidentiality\""
  - name: judged-0
    type: llm
    criteria: "Agent advises NOT to push and walks through soft reset (git reset HEAD~1), content removal, and re-commit steps."
