schema_version: "1.1"
name: oracle-confidentiality--sanitize-document
description: "Should trigger oracle-confidentiality. Expected (not graded): Agent rewrites document replacing identifying details with codename/generic references."
tags: [oracle-confidentiality, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Can you sanitize this proposal draft so it doesn't mention the client's real name, industry, or the pricing we discussed?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?oracle-confidentiality\""
