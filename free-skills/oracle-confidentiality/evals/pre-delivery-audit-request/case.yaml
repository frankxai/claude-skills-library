schema_version: "1.1"
name: oracle-confidentiality--pre-delivery-audit-request
description: "Should trigger oracle-confidentiality. Expected (not graded): Agent runs the pre-delivery audit checklist and reports PASS/FAIL/WARN with specific findings."
tags: [oracle-confidentiality, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "I'm about to send the solution design document to the customer—can you run a confidentiality check on it before I hand it off?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?oracle-confidentiality\""
