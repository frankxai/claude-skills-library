schema_version: "1.1"
name: css-animations--transform-over-layout
description: "Behaviour of css-animations; outcome graded."
tags: [css-animations, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Animate a card moving 200px to the right over 2 seconds in my HyperFrames clip using CSS."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?css-animations\""
  - name: judged-0
    type: llm
    criteria: "The produced keyframes animate transform (translateX/translate) rather than top/left/width/height."
