schema_version: "1.1"
name: higgsfield-product-photoshoot--no-product-landscape
description: "Should NOT trigger higgsfield-product-photoshoot. Expected (not graded): Does not invoke product-photoshoot; raw text-to-image belongs elsewhere"
tags: [higgsfield-product-photoshoot, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Generate a painting of a mountain landscape at sunset, no product, just art"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?higgsfield-product-photoshoot\""
    min: 0
    max: 0
    arm: both
