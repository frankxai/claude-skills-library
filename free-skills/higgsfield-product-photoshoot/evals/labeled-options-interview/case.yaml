schema_version: "1.1"
name: higgsfield-product-photoshoot--labeled-options-interview
description: "Behaviour of higgsfield-product-photoshoot; outcome graded."
tags: [higgsfield-product-photoshoot, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Make me something cool for my brand"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?higgsfield-product-photoshoot\""
  - name: judged-0
    type: llm
    criteria: "Asks at most 4 short questions with labeled multiple-choice options (not open-ended) before generating"
