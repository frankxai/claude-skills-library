schema_version: "1.1"
name: surface-craft--no-trigger-standup
description: "Should NOT trigger surface-craft: internal notes have no stranger as reader."
tags: [surface-craft, should-not-trigger]
runs: 2
execution:
  prompt: "Tidy these notes for tomorrow's internal standup into three bullets: fixed the CSV export bug, still blocked on the payroll API key, pairing with Sam on the rota swap flow after lunch."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?surface-craft\""
    min: 0
    max: 0
    arm: both
