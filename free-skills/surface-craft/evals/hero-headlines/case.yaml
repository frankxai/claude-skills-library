schema_version: "1.1"
name: surface-craft--hero-headlines
description: "Should trigger surface-craft; output must carry a claim ledger and clean headlines."
tags: [surface-craft, should-trigger, outcome]
runs: 2
execution:
  prompt: "I need hero headlines and a subhead for the landing page of Plotwise, an app that turns a photo of a seed packet into a planting calendar for your allotment. Facts we have: in our test with 40 packets it read the sowing window correctly on 37; it works offline after the first download; it is free for up to 10 packets and costs 3 euros a month after that; around 1,200 people used the closed beta since April. Our buyers are UK allotment holders. Draft text from my cofounder: 'Unlock Effortless Gardening: Plotwise Is Not Just An App, It Is Your Garden Coach. Trusted by 10,000 gardeners.'"
  max_turns: 12
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?surface-craft\""
  - name: claim-ledger-present
    type: regex
    pattern: "claim ledger[\\s\\S]{0,6000}source"
    flags: i
  - name: no-banned-headline-pattern
    type: llm
    criteria: "Judge only the headlines the final answer presents as kept, final or recommended (if none are marked, judge every headline it proposes for use). PASS only if every one of them: (a) contains none of these words or their inflections: unlock, elevate, seamless, supercharge, empower, transform, revolutionise, revolutionize, reimagine, effortless, next-level, game-changer, delve, leverage; (b) does not use a not-X-but-Y contrast (for example \"It is not X, it is Y\", \"Not just X\", \"More than X\"); (c) does not use a colon-reveal or dash-reveal (a setup phrase, then a colon or dash, then the reveal, for example \"Rotas, reimagined: meet Shiftbook\"); (d) is in sentence case, with capitals only on the first word, proper nouns and product names; (e) for a hero headline, has eight words or fewer. FAIL if any kept headline breaks any of (a) to (e), or if the answer contains no headline at all."
