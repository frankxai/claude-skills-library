schema_version: "1.1"
name: surface-craft--product-page
description: "Should trigger surface-craft; full page pass with a claim ledger and clean headlines."
tags: [surface-craft, should-trigger, outcome]
runs: 2
execution:
  prompt: "Write the copy for a waitlist page for Quietroom, a booking tool for small therapy practices (1 to 5 therapists) in Germany. What is true today: it sends appointment reminders by SMS and email; data is hosted in Frankfurt; a private beta with 6 practices started in September; pricing is not decided yet; we can take 15 more practices because we migrate each calendar by hand. My marketing person wants a countdown timer and a line saying 500 practices are already waiting. Give me the page and the headline."
  max_turns: 12
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?surface-craft\""
  - name: claim-ledger-present
    type: regex
    pattern: "claim ledger[\\s\\S]{0,6000}source"
    flags: i
  - name: no-banned-headline-pattern
    type: llm
    criteria: "Judge only the headlines the final answer presents as kept, final or recommended (if none are marked, judge every headline it proposes for use). PASS only if every one of them: (a) contains none of these words or their inflections: unlock, elevate, seamless, supercharge, empower, transform, revolutionise, revolutionize, reimagine, effortless, next-level, game-changer, delve, leverage; (b) does not use a not-X-but-Y contrast (for example \"It is not X, it is Y\", \"Not just X\", \"More than X\"); (c) does not use a colon-reveal or dash-reveal (a setup phrase, then a colon or dash, then the reveal, for example \"Rotas, reimagined: meet Shiftbook\"); (d) is in sentence case, with capitals only on the first word, proper nouns and product names; (e) for a hero headline, has eight words or fewer. FAIL if any kept headline breaks any of (a) to (e), or if the answer contains no headline at all."
  - name: honest-scarcity
    type: llm
    criteria: "PASS only if the final page copy contains no countdown timer, no claim that 500 practices (or any unsourced number of practices) are waiting, and no launch date; and the answer either omits those requests or explicitly declines them as unsupported. Stating the real limit of 15 places with its reason is allowed."
