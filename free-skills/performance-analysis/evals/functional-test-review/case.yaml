schema_version: "1.1"
name: performance-analysis--functional-test-review
description: "Should NOT trigger performance-analysis. Expected (not graded): Agent does not run claude-flow bottleneck/performance-report commands; responds with a normal code review and tests"
tags: [performance-analysis, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Review this pull request for correctness bugs and add unit tests covering the edge cases in the payment module."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?performance-analysis\""
    min: 0
    max: 0
    arm: both
