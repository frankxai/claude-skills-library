schema_version: "1.1"
name: health-nutrition-expert--diet-plan-request
description: "Should trigger health-nutrition-expert. Expected (not graded): Agent provides an evidence-based, personalized meal plan referencing nutrient density, protein targets, or gut health principles."
tags: [health-nutrition-expert, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Help me plan a week of meals to improve my metabolic health and lose some belly fat"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?health-nutrition-expert\""
