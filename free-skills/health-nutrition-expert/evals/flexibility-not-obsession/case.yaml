schema_version: "1.1"
name: health-nutrition-expert--flexibility-not-obsession
description: "Behaviour of health-nutrition-expert; outcome graded."
tags: [health-nutrition-expert, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "I eat 100% clean, never touch sugar or processed food, and feel guilty if I slip. Is my strictness good?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?health-nutrition-expert\""
  - name: judged-0
    type: llm
    criteria: "Agent addresses orthorexia risk and recommends the 80/20 rule (Final Principle 10) rather than endorsing extreme restriction."
