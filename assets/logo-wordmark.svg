<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="900" height="160" role="img" aria-labelledby="t">
  <title id="t">Claude Skills Library wordmark</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- mark -->
  <g transform="translate(16 16) scale(0.5)">
    <rect width="256" height="256" rx="56" fill="#0a0a0b"/>
    <rect x="78" y="58" width="112" height="76" rx="12" fill="none" stroke="url(#g)" stroke-width="4" opacity="0.35"/>
    <rect x="66" y="82" width="124" height="80" rx="12" fill="#0a0a0b" stroke="url(#g)" stroke-width="4" opacity="0.7"/>
    <rect x="52" y="108" width="140" height="88" rx="14" fill="#0a0a0b" stroke="url(#g)" stroke-width="5"/>
    <rect x="72" y="130" width="58" height="8" rx="4" fill="url(#g)"/>
