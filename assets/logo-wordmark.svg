  </g>
  <!-- wordmark -->
  <text x="170" y="78" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#f5f5f4">Claude Skills Library</text>
  <text x="172" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="url(#g)">skills that install, validate, and enforce</text>
