schema_version: "1.1"
name: to-spec--open-items-not-guessed
description: "Behaviour of to-spec; outcome graded."
tags: [to-spec, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Write this up as a spec. Note we never decided what the retry policy for failed webhook deliveries should be, and we didn't pick a label colour either."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?to-spec\""
  - name: judged-0
    type: llm
    criteria: "The issue body contains an '## Open' section listing both undecided items tagged [OPEN], with no guessed values filled in."
