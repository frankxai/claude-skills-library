schema_version: "1.1"
name: to-spec--write-up-as-spec
description: "Should trigger to-spec. Expected (not graded): Agent files a GitHub issue on the product repo with the agreed decisions, no follow-up interview questions."
tags: [to-spec, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "We've settled it: no WebRTC for now, just polling every 5 seconds, and the notification payload stays under 1KB. Write this up as a spec please."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?to-spec\""
