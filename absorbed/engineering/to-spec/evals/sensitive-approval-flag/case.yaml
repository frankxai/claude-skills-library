schema_version: "1.1"
name: to-spec--sensitive-approval-flag
description: "Behaviour of to-spec; outcome graded."
tags: [to-spec, behaviour, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "We decided the payment retries charge the card again after 24 hours and we store the last four digits of the card in the customers table. Open an issue for this."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?to-spec\""
  - name: judged-0
    type: llm
    criteria: "The issue's Decisions section flags both money-handling and schema changes as needing Frank's approval."
