schema_version: "1.1"
name: to-spec--still-brainstorming
description: "Should NOT trigger to-spec. Expected (not graded): No spec or issue is created; the user is still deciding."
tags: [to-spec, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "I'm still not sure whether we should use Redis or Postgres for the rate limiter, what do you think the tradeoffs are?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?to-spec\""
    min: 0
    max: 0
    arm: both
