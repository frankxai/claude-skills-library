schema_version: "1.1"
name: source-driven-development--pure-refactor-no-imports
description: "Should NOT trigger source-driven-development."
tags: [source-driven-development, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Refactor utils/date.ts: extract the duplicated date-formatting logic into a single formatDate function and rename the file to dates.ts. The file has no external imports — pure Date/string logic and a couple of internal helpers, no versions involved."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?source-driven-development\""
    min: 0
    max: 0
    arm: both
