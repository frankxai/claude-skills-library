schema_version: "1.1"
name: diagnosing-bugs--slow-endpoint
description: "Should trigger diagnosing-bugs. Expected (not graded): Agent measures a baseline and instruments rather than theorising from code reading"
tags: [diagnosing-bugs, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "The /search endpoint used to respond in 200ms but after last week's deploy it takes 8+ seconds. Help me find the cause."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?diagnosing-bugs\""
