schema_version: "1.1"
name: diagnosing-bugs--greenfield-feature
description: "Should NOT trigger diagnosing-bugs. Expected (not graded): No bug to diagnose; normal feature work"
tags: [diagnosing-bugs, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Can you design and implement a new CSV export feature for the reports page?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?diagnosing-bugs\""
    min: 0
    max: 0
    arm: both
