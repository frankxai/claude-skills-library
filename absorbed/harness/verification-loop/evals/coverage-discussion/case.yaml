schema_version: "1.1"
name: verification-loop--coverage-discussion
description: "Should NOT trigger verification-loop. Expected (not graded): Skill not triggered; this is a question about improving coverage, not a pre-commit verification."
tags: [verification-loop, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "How do I get jest coverage up to 85% on the payments module?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?verification-loop\""
    min: 0
    max: 0
    arm: both
