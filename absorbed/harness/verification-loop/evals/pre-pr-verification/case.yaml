schema_version: "1.1"
name: verification-loop--pre-pr-verification
description: "Should trigger verification-loop. Expected (not graded): Runs the six checks in order and produces the VERIFICATION report block with build/types/lint/tests/secrets lines."
tags: [verification-loop, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "I just finished the auth refactor — can you run through the checks and tell me if it's ready before I open a PR?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?verification-loop\""
