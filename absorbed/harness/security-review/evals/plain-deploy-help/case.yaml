schema_version: "1.1"
name: security-review--plain-deploy-help
description: "Should NOT trigger security-review. Expected (not graded): No security-review scan or deny-list behaviour invoked; just Dockerfile help."
tags: [security-review, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Help me write a Dockerfile for a simple Flask app."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?security-review\""
    min: 0
    max: 0
    arm: both
