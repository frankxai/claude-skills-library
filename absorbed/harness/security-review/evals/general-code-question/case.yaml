schema_version: "1.1"
name: security-review--general-code-question
description: "Should NOT trigger security-review. Expected (not graded): No security scan; treated as a normal coding question."
tags: [security-review, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Can you explain how the defer statement works in Go?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?security-review\""
    min: 0
    max: 0
    arm: both
