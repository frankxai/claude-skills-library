schema_version: "1.1"
name: feynman-thinking--code-only-no-explanation
description: "Should NOT trigger feynman-thinking."
tags: [feynman-thinking, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Write a function that parses the config YAML and returns a dict — code only, no explanation needed."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?feynman-thinking\""
    min: 0
    max: 0
    arm: both
