schema_version: "1.1"
name: feynman-thinking--outcome-a
description: "Should trigger feynman-thinking; outcome graded."
tags: [feynman-thinking, should-trigger]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Here is how our system works, spelled out in full so you don't need to look anything up: a request first hits an auth middleware that checks a signed JWT and attaches the user id; the middleware then forwards the request to a suggestion engine, which embeds the user's recent activity, queries a vector index, and returns the top-ranked items. Explain this flow simply. Build me a mental model, Feynman style."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?feynman-thinking\""
  - name: judged-0
    type: llm
    criteria: "PASS only if it opens with a plain-English statement of the problem, gives a mental model (inputs, outputs, data flow), and shows the flow as a simple text or ASCII diagram, avoiding jargon."
