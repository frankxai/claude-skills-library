schema_version: "1.1"
name: feynman-thinking--no-trigger
description: "Should NOT trigger feynman-thinking."
tags: [feynman-thinking, should-not-trigger]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "List the prime numbers below 30."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?feynman-thinking\""
    min: 0
    max: 0
    arm: both
