schema_version: "1.1"
name: feynman-thinking--feynman-style-request
description: "Should trigger feynman-thinking."
tags: [feynman-thinking, should-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Explain Feynman-style how the Raft consensus algorithm works; I want to actually understand it, not just memorize the steps."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?feynman-thinking\""
