schema_version: "1.1"
name: feynman-thinking--outcome-b
description: "Should trigger feynman-thinking; outcome graded."
tags: [feynman-thinking, should-trigger]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Here is our caching layer, described in full so you don't need to look anything up: a read-through cache sits in front of Postgres, each key has a 5-minute TTL, and every write runs a hook that invalidates the matching cache key. I do not understand this architecture. Explain it so a junior developer could follow it, and ask me questions that expose what I am assuming."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?feynman-thinking\""
  - name: judged-0
    type: llm
    criteria: "PASS only if it explains in plain terms with a simple model and also asks at least two Socratic questions that probe assumptions."
