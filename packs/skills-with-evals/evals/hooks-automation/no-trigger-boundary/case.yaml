schema_version: "1.1"
name: hooks-automation--no-trigger-boundary
description: "Should NOT trigger hooks-automation: a React hook shares the word hook but is not a Claude Code lifecycle hook."
tags: [hooks-automation, should-not-trigger, boundary]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Write a React custom hook useDebounce(value, delayMs) in TypeScript that returns the debounced value. Code only."
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?hooks-automation\""
    min: 0
    max: 0
    arm: both
