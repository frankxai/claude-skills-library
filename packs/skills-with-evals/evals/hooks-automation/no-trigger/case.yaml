schema_version: "1.1"
name: hooks-automation--no-trigger
description: "Should NOT trigger hooks-automation."
tags: [hooks-automation, should-not-trigger]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "Rename the variable foo to bar in: foo = 1; print(foo + 2)"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?hooks-automation\""
    min: 0
    max: 0
    arm: both
