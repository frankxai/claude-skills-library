schema_version: "1.1"
name: neutron-log--general-ccusage-question
description: "Should NOT trigger neutron-log. Expected (not graded): Skill not triggered; this is a general usage question, not a before/after verification of a compressor."
tags: [neutron-log, should-not-trigger, generated]
runs: 2
execution:
  model: claude-sonnet-5
  prompt: "How do I install ccusage and read my weekly token spend report?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?neutron-log\""
    min: 0
    max: 0
    arm: both
