  <g fill="#F4F7FF">
    <circle cx="28" cy="78" r="3.2"/>
    <circle cx="46" cy="46" r="3.6"/>
    <circle cx="64" cy="62" r="2.6"/>
    <circle cx="64" cy="86" r="3.2"/>
    <circle cx="86" cy="34" r="4.2"/>
    <circle cx="100" cy="58" r="3"/>
