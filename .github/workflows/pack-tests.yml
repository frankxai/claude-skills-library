name: pack-tests

on:
  pull_request:
    paths:
      - 'packs/**'
      - '.github/workflows/pack-tests.yml'
  push:
    branches: [main]
    paths:
      - 'packs/**'

jobs:
  node-pack-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every pack's node test suite
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(packs/*/tests/*.test.mjs)
          if [ ${#files[@]} -eq 0 ]; then echo "no node pack tests found"; exit 0; fi
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          node --test "${files[@]}"
