name: Link Checker

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  pull_request:
    paths: ['**/*.md', '.lycheeignore', '.github/workflows/link-checker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Templates (docs/readme-template.md, skill-builder) contain placeholder paths by design.
          # free-skills/anthropic/ is vendored verbatim from Anthropic; its site-relative links are upstream's.
          args: >-
            --accept=200,204,206,429
            --timeout=20 --max-retries=3
            --exclude-path docs/readme-template.md
            --exclude-path free-skills/skill-builder/SKILL.md
            --exclude-path free-skills/anthropic
            --no-progress
            '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
