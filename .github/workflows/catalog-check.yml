name: Catalog check

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "free-skills/**"
      - "catalog/**"
      - "scripts/build-catalog.mjs"
      - ".github/workflows/catalog-check.yml"
  pull_request:
    branches: [main]
    paths:
      - ".claude-plugin/**"
      - "free-skills/**"
      - "catalog/**"
      - "scripts/build-catalog.mjs"
      - ".github/workflows/catalog-check.yml"

concurrency:
  group: catalog-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: catalog/skills.json matches marketplace.json and SKILL.md frontmatter
        run: node scripts/build-catalog.mjs --check
