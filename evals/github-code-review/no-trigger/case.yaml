schema_version: "1.1"
name: github-code-review--no-trigger
description: "Should NOT trigger github-code-review: an adjacent but different task."
tags: [github-code-review, should-not-trigger]
runs: 3
execution:
  prompt: "Write a short README section that explains how to run this project's test suite with `npm test` and how to run a single test file."
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?github-code-review\""
    min: 0
    max: 0
    arm: both
