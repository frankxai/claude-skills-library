schema_version: "1.1"
name: ai-architect-review--no-trigger
description: "Should NOT trigger ai-architect-review: an adjacent but different task."
tags: [ai-architect-review, should-not-trigger]
runs: 3
execution:
  prompt: "Write a Python script that reads a CSV of support tickets (columns: id, created_at, closed_at) and prints the median time to close in hours."
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?ai-architect-review\""
    min: 0
    max: 0
    arm: both
