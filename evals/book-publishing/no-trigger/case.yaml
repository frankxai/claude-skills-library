schema_version: "1.1"
name: no-trigger
description: "Should NOT trigger book-publishing: a near miss that mentions a PDF and a review but has nothing to do with books."
tags: [book-publishing, should-not-trigger]
runs: 2
execution:
  prompt: "Write a one-line git commit message for a change that fixes the PDF export of invoices, then a one-sentence note for the code reviewer."
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: "\"skill\"\s*:\s*\"(?:[\w-]+:)?book-publishing\""
    min: 0
    max: 0
    arm: both
