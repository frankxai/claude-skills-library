schema_version: "1.1"
name: no-trigger
description: "Should NOT trigger excellence-book-writing: a near miss that asks for a quick proofread of a two-sentence email, not long-form nonfiction."
tags: [excellence-book-writing, should-not-trigger]
runs: 2
execution:
  prompt: "Proofread this out-of-office reply for typos and return the corrected text only: 'Im away untill Monday 3 November with limited acess to email. For urgent issues please contact Priya on the support desk.'"
  max_turns: 4
  allowed_tools: [Skill, Read]
