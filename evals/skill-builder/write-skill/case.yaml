schema_version: "1.1"
name: write-skill
description: "Outcome. Author a SKILL.md for a described workflow; graded on the Agent Skills spec and on routing text that survives Codex's ~100-character description window."
tags: [skill-builder, outcome, should-trigger]
runs: 3
execution:
  prompt: |
    Before every Postgres schema migration our team does four things: (1) make sure the migration has a
    working rollback, (2) run it against a copy of production and note how long it takes, (3) avoid long
    locks on tables over a million rows (for example CREATE INDEX CONCURRENTLY and batched backfills),
    and (4) make sure the currently deployed app still works with the new schema during the deploy.

    Write the complete SKILL.md for an Agent Skill that makes Claude Code and Codex apply this checklist
    automatically whenever someone writes or reviews a database migration. Reply with only the file
    content, starting with the frontmatter.
  max_turns: 6
  timeout_seconds: 600
  allowed_tools: [Skill, Read]
