<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Checkout · Northwind Running</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #ffffff; color: #1b1f24; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  .item { display: flex; gap: 16px; align-items: center; border-bottom: 1px solid #6b7480; padding-block: 16px; }
  .item img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; }
  .qty { display: flex; align-items: center; gap: 0; }
  .qty button { width: 20px; height: 20px; padding: 0; font-size: 12px; border: 1px solid #6b7480; background: #f4f5f7; }
  .qty output { margin-left: 8px; }
  .hint { color: #a0a0a0; font-size: 13px; }
  form { display: grid; gap: 14px; margin-top: 24px; }
  input { font-size: 16px; padding: 12px; border: 1px solid #6b7480; border-radius: 6px; }
  input.error { border-color: #d00000; }
  button, input { transition: border-color .2s; }
  button:focus, input:focus { outline: none; }
  .pay { font-size: 16px; padding: 14px; border: 0; border-radius: 6px; background: #1b5fd1; color: #ffffff; }
</style>
</head>
<body>
<main>
  <h1>Your order</h1>
  <div class="item">
    <img src="/img/trail-runner-v3.jpg">
    <div>
      <p><strong>Trail Runner v3</strong> · €129.00</p>
      <div class="qty"><button type="button" aria-label="Decrease quantity">−</button><button type="button" aria-label="Increase quantity">+</button><output aria-live="polite">1</output></div>
    </div>
  </div>
  <p class="hint">Free shipping on orders over €100. Delivery in 2–4 working days.</p>

  <form action="/pay" method="post">
    <input type="email" name="email" autocomplete="email" placeholder="Email">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" autocomplete="name">
    <label for="card">Card number</label>
    <input id="card" name="card" class="error" type="text" inputmode="numeric" autocomplete="cc-number" value="4242 4242 4242">
    <button class="pay" type="submit">Pay €129.00</button>
  </form>
  <p><a href="/terms">Click here</a></p>
</main>
</body>
</html>
